```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 버스 도착 알림</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fa;
      color: #222;
    }

    h1 {
      text-align: center;
      color: #1769aa;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

    #result {
      margin-top: 20px;
    }

    .bus-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px #0001;
    }

    .bus-number {
      font-size: 20px;
      font-weight: bold;
      color: #1769aa;
      margin-bottom: 8px;
    }

    .message {
      line-height: 1.7;
    }

    .notice {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <h1>🚌 서울 버스 도착정보</h1>

  <div class="search-box">
    <label for="serviceKey">공공데이터 API 인증키</label>
    <input
      type="password"
      id="serviceKey"
      placeholder="발급받은 인증키를 입력하세요"
      autocomplete="off"
    >

    <label for="arsId">정류소 고유번호</label>
    <input
      type="text"
      id="arsId"
      placeholder="예: 02150"
      inputmode="numeric"
    >

    <button id="searchButton" onclick="searchBus()">
      버스 도착정보 조회
    </button>

    <p class="notice">
      인증키는 페이지에 직접 입력합니다.
      정류소 고유번호는 버스 정류장 안내판에서 확인할 수 있습니다.
    </p>
  </div>

  <div id="result" aria-live="polite"></div>

  <script>
    async function searchBus() {
      const serviceKey =
        document.getElementById("serviceKey").value.trim();

      const arsId =
        document.getElementById("arsId").value.trim();

      const result = document.getElementById("result");
      const button = document.getElementById("searchButton");

      if (!serviceKey || !arsId) {
        result.textContent = "인증키와 정류소 고유번호를 입력해 주세요.";
        return;
      }

      if (!/^\d+$/.test(arsId)) {
        result.textContent = "정류소 고유번호는 숫자로 입력해 주세요.";
        return;
      }

      button.disabled = true;
      result.textContent = "버스 도착정보를 조회하고 있습니다.";

      try {
        const url =
          "https://ws.bus.go.kr/api/rest/stationinfo/getStationByUid" +
          "?ServiceKey=" + encodeURIComponent(serviceKey) +
          "&arsId=" + encodeURIComponent(arsId);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("HTTP 오류: " + response.status);
        }

        const xmlText = await response.text();
        const xml = new DOMParser().parseFromString(
          xmlText,
          "application/xml"
        );

        if (xml.querySelector("parsererror")) {
          throw new Error("응답 데이터를 XML로 읽을 수 없습니다.");
        }

        const headerCode =
          xml.getElementsByTagName("headerCd")[0]?.textContent;

        if (headerCode && headerCode !== "0") {
          const message =
            xml.getElementsByTagName("headerMsg")[0]?.textContent ||
            "API 요청을 처리하지 못했습니다.";

          result.textContent = "조회 실패: " + message;
          return;
        }

        const items = Array.from(
          xml.getElementsByTagName("itemList")
        );

        if (items.length === 0) {
          result.textContent =
            "도착정보가 없습니다. 정류소 번호와 인증키를 확인해 주세요.";
          return;
        }

        result.innerHTML = "";

        items.forEach(item => {
          const getValue = (tag) =>
            item.getElementsByTagName(tag)[0]?.textContent || "-";

          const card = document.createElement("div");
          card.className = "bus-card";

          const number = document.createElement("div");
          number.className = "bus-number";
          number.textContent = getValue("rtNm") + "번 버스";

          const first = document.createElement("div");
          first.className = "message";
          first.textContent = "첫 번째 도착: " + getValue("arrmsg1");

          const second = document.createElement("div");
          second.className = "message";
          second.textContent = "두 번째 도착: " + getValue("arrmsg2");

          card.append(number, first, second);
          result.appendChild(card);
        });

      } catch (error) {
        console.error(error);

        result.textContent =
          "조회에 실패했습니다. 인증키와 정류소 번호를 확인해 주세요. " +
          "계속 실패하면 브라우저의 HTTPS/CORS 제한 때문일 수 있습니다.";
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("arsId").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        searchBus();
      }
    });
  </script>
</body>
</html>
```
