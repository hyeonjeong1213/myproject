```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 버스 도착 알림</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fa;
      color: #222;
    }

    h1 {
      text-align: center;
      color: #1769aa;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #1769aa;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

    .key-row,
    .ars-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    .key-row input,
    .ars-row input {
      flex: 1;
      min-width: 0;
    }

    .key-row button,
    .ars-row button {
      flex-shrink: 0;
      white-space: nowrap;
    }

    .key-row button {
      margin-top: 0;
    }

    .ars-row button {
      min-width: 100px;
    }

    #keyStatus {
      margin-top: 10px;
      font-size: 13px;
      color: #16803c;
    }

    #result {
      margin-top: 20px;
    }

    .bus-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px #0001;
    }

    .bus-number {
      font-size: 20px;
      font-weight: bold;
      color: #1769aa;
      margin-bottom: 8px;
    }

    .message {
      line-height: 1.7;
    }

    .notice {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    @media (max-width: 420px) {
      .key-row,
      .ars-row {
        flex-wrap: wrap;
      }

      .key-row button,
      .ars-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <h1>🚌 서울 버스 도착정보</h1>

  <!-- 인증키 설정 -->
  <div class="search-box">
    <h2>API 인증키 설정</h2>

    <label for="serviceKey">공공데이터 API 인증키</label>

    <div class="key-row">
      <input
        type="password"
        id="serviceKey"
        placeholder="발급받은 인증키 입력"
        autocomplete="off"
      >

      <button type="button" onclick="saveKey()">
        인증키 저장
      </button>
    </div>

    <div id="keyStatus" aria-live="polite"></div>

    <button
      type="button"
      onclick="deleteKey()"
      style="margin-top: 10px; background: #777;"
    >
      저장된 인증키 삭제
    </button>

    <p class="notice">
      인증키는 이 브라우저에 저장됩니다.
      공용 컴퓨터에서는 저장하지 마세요.
    </p>
  </div>

  <!-- 정류소 검색 -->
  <div class="search-box">
    <label for="arsId">정류소 고유번호 (ARS ID)</label>

    <div class="ars-row">
      <input
        type="text"
        id="arsId"
        placeholder="예: 06001"
        inputmode="numeric"
      >

      <button
        type="button"
        id="searchButton"
        onclick="searchBus()"
      >
        조회하기
      </button>
    </div>

    <p class="notice">
      서울시 정류소 번호를 입력해 주세요.
    </p>
  </div>

  <!-- 도착정보 -->
  <div class="search-box">
    <h2>실시간 도착정보</h2>
    <div id="result" aria-live="polite">
      먼저 인증키를 설정해 주세요.
    </div>
  </div>

  <script>
    const KEY_STORAGE = "seoulBusServiceKey";

    // 페이지를 열면 저장된 인증키 불러오기
    window.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem(KEY_STORAGE);

      if (savedKey) {
        document.getElementById("serviceKey").value = savedKey;
        document.getElementById("keyStatus").textContent =
          "인증키가 저장되어 있습니다.";
        document.getElementById("result").textContent =
          "정류소 번호를 입력하고 조회해 주세요.";
      }
    });

    // 인증키 저장
    function saveKey() {
      const key = document
        .getElementById("serviceKey")
        .value.trim();

      const status = document.getElementById("keyStatus");

      if (!key) {
        status.style.color = "#d93025";
        status.textContent = "인증키를 입력해 주세요.";
        return;
      }

      try {
        localStorage.setItem(KEY_STORAGE, key);
        status.style.color = "#16803c";
        status.textContent = "인증키가 저장되었습니다.";
        document.getElementById("result").textContent =
          "정류소 번호를 입력하고 조회해 주세요.";
      } catch (error) {
        status.style.color = "#d93025";
        status.textContent =
          "브라우저에 인증키를 저장할 수 없습니다.";
      }
    }

    // 저장된 인증키 삭제
    function deleteKey() {
      localStorage.removeItem(KEY_STORAGE);
      document.getElementById("serviceKey").value = "";

      const status = document.getElementById("keyStatus");
      status.style.color = "#16803c";
      status.textContent = "저장된 인증키를 삭제했습니다.";

      document.getElementById("result").textContent =
        "먼저 인증키를 설정해 주세요.";
    }

    // 버스 도착정보 조회
    async function searchBus() {
      const keyInput = document
        .getElementById("serviceKey")
        .value.trim();

      const savedKey = localStorage.getItem(KEY_STORAGE);
      const serviceKey = savedKey || keyInput;

      const arsId = document
        .getElementById("arsId")
        .value.trim();

      const result = document.getElementById("result");
      const button = document.getElementById("searchButton");

      if (!serviceKey) {
        result.textContent =
          "먼저 인증키를 입력하고 저장해 주세요.";
        return;
      }

      if (!arsId) {
        result.textContent = "정류소 고유번호를 입력해 주세요.";
        return;
      }

      if (!/^\d+$/.test(arsId)) {
        result.textContent =
          "정류소 고유번호는 숫자로 입력해 주세요.";
        return;
      }

      button.disabled = true;
      result.textContent = "버스 도착정보를 조회하고 있습니다.";

      try {
        const url =
          "https://ws.bus.go.kr/api/rest/stationinfo/getStationByUid" +
          "?ServiceKey=" + encodeURIComponent(serviceKey) +
          "&arsId=" + encodeURIComponent(arsId);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("HTTP 오류: " + response.status);
        }

        const xmlText = await response.text();

        const xml = new DOMParser().parseFromString(
          xmlText,
          "application/xml"
        );

        if (xml.querySelector("parsererror")) {
          throw new Error("XML_PARSE_ERROR");
        }

        const headerCode =
          xml.getElementsByTagName("headerCd")[0]?.textContent;

        const headerMessage =
          xml.getElementsByTagName("headerMsg")[0]?.textContent;

        if (headerCode && headerCode !== "0") {
          result.textContent =
            "서울시 API 오류: " +
            (headerMessage || headerCode);
          return;
        }

        const items = Array.from(
          xml.getElementsByTagName("itemList")
        );

        if (items.length === 0) {
          result.textContent =
            "도착정보가 없습니다. 정류소 번호를 확인하거나 " +
            "다른 시간에 다시 조회해 주세요.";
          return;
        }

        result.replaceChildren();

        items.forEach(item => {
          const getValue = tag =>
            item.getElementsByTagName(tag)[0]?.textContent || "-";

          const card = document.createElement("div");
          card.className = "bus-card";

          const number = document.createElement("div");
          number.className = "bus-number";
          number.textContent = getValue("rtNm") + "번 버스";

          const first = document.createElement("div");
          first.className = "message";
          first.textContent =
            "첫 번째 도착: " + getValue("arrmsg1");

          const second = document.createElement("div");
          second.className = "message";
          second.textContent =
            "두 번째 도착: " + getValue("arrmsg2");

          card.append(number, first, second);
          result.appendChild(card);
        });

      } catch (error) {
        console.error(error);

        if (error.message === "XML_PARSE_ERROR") {
          result.textContent =
            "API 응답을 해석하지 못했습니다. 인증키와 API 응답 형식을 확인해 주세요.";
        } else if (error instanceof TypeError) {
          result.textContent =
            "API 서버에 연결하지 못했습니다. HTTPS 또는 CORS 제한일 수 있습니다. " +
            "인증키를 입력해도 이 제한은 해결되지 않으며, 중계 서버가 필요할 수 있습니다.";
        } else {
          result.textContent =
            "조회 중 오류가 발생했습니다: " + error.message;
        }
      } finally {
        button.disabled = false;
      }
    }

    // Enter 키로 조회
    document.getElementById("arsId").addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          searchBus();
        }
      }
    );

    // 인증키 입력란에서도 Enter를 누르면 저장
    document.getElementById("serviceKey").addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          saveKey();
        }
      }
    );
  </script>
</body>
</html>
