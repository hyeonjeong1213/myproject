
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울 버스 도착 알림</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #202938;
    }

    .container {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 6px 24px #0000000c;
    }

    h1 { margin-top: 0; font-size: 26px; }
    .description { color: #64748b; line-height: 1.6; }

    .search {
      display: flex;
      gap: 8px;
      margin: 22px 0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      padding: 12px 17px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    #status { color: #64748b; margin: 12px 0; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      background: white;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
    }

    th { background: #f8fafc; font-size: 13px; }

    .arrival {
      color: #2563eb;
      font-weight: bold;
    }

    .footer {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      body { margin: 12px auto; padding: 10px; }
      .container { padding: 18px; }
      h1 { font-size: 22px; }
      .search { flex-direction: column; }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>🚌 서울 버스 도착 알림</h1>

    <p class="description">
      정류소고유번호를 입력하면 해당 정류소의
      버스 도착정보를 조회할 수 있어요.
    </p>

    <div class="search">
      <input
        id="arsId"
        type="text"
        inputmode="numeric"
        maxlength="5"
        placeholder="예: 02123"
        aria-label="정류소고유번호"
      >
      <button id="searchBtn" onclick="searchBus()">조회하기</button>
    </div>

    <p id="status" role="status">정류소 번호를 입력해 주세요.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>버스 번호</th>
            <th>도착 예정</th>
            <th>잔여 정류장</th>
          </tr>
        </thead>
        <tbody id="result">
          <tr>
            <td colspan="3">조회 결과가 여기에 표시됩니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="footer">
      데이터 출처: 서울특별시 버스정보 API<br>
      도착 예정 시간은 실시간 교통 상황에 따라 달라질 수 있습니다.
    </p>
  </main>

  <script>
    // GAS 웹 앱을 배포한 후 생성되는 URL로 변경
    const GAS_URL = 'AKfycbxwUcozAS30peASXqZZ8k2onaZ495qfu3chx-yatmjlrMaAXGYSbZMgyGqFsAIeVdGxYQ';

    function searchBus() {
      const arsId = document.getElementById('arsId').value.trim();
      const status = document.getElementById('status');
      const button = document.getElementById('searchBtn');
      const result = document.getElementById('result');

      if (!/^\d{5}$/.test(arsId)) {
        status.textContent = '정류소고유번호 5자리를 입력해 주세요.';
        return;
      }

      if (!GAS_URL.startsWith('https://')) {
        status.textContent = '먼저 GAS 웹 앱 URL을 설정해 주세요.';
        return;
      }

      status.textContent = '버스 도착정보를 조회하고 있어요...';
      result.replaceChildren();
      button.disabled = true;

      const callbackName =
        'busCallback_' + Date.now() + '_' +
        Math.random().toString(36).slice(2, 8);

      const script = document.createElement('script');
      let finished = false;

      const timeout = setTimeout(function() {
        finish();
        status.textContent =
          '응답 시간이 초과됐어요. GAS 배포 및 API 설정을 확인해 주세요.';
      }, 15000);

      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
        button.disabled = false;
      }

      window[callbackName] = function(data) {
        finish();

        if (!data || !data.success) {
          status.textContent =
            data && data.message ? data.message : '조회에 실패했어요.';
          return;
        }

        status.textContent =
          '정류소 ' + data.arsId + ' · 총 ' + data.count + '개 버스';

        if (!data.arrivals || data.arrivals.length === 0) {
          result.innerHTML =
            '<tr><td colspan="3">도착정보가 없습니다.</td></tr>';
          return;
        }

        data.arrivals.forEach(function(bus) {
          const tr = document.createElement('tr');

          [
            bus.routeName || '-',
            bus.arrival1 || '정보 없음',
            bus.remainingStops1
              ? bus.remainingStops1 + '개 전'
              : '정보 없음'
          ].forEach(function(value, index) {
            const td = document.createElement('td');
            td.textContent = value;

            if (index === 1) td.className = 'arrival';

            tr.appendChild(td);
          });

          result.appendChild(tr);
        });
      };

      script.onerror = function() {
        finish();
        status.textContent =
          'GAS 연결에 실패했어요. 웹 앱 URL과 배포 권한을 확인해 주세요.';
      };

      script.src = GAS_URL +
        '?action=arrival' +
        '&arsId=' + encodeURIComponent(arsId) +
        '&callback=' + encodeURIComponent(callbackName);

      document.body.appendChild(script);
    }

    document.getElementById('arsId').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchBus();
    });
  </script>
</body>
</html>
